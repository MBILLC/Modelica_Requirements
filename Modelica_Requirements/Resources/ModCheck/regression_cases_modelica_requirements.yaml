  - name: MR_Examples_SimplePumpingSystem_Components_PumpingSystem
    # Generated 2026-09-13 from Modelica_Requirements.Examples.SimplePumpingSystem.Components.PumpingSystem's experiment annotation.
    # No top-level outputs: `variables:` is the --variables glob given to the generator.
    #
    # HAND-TUNED after the first run: an on-off pressure controller switching
    # for 2000 s. Its switching instants move with the solver tolerance, so at
    # the harness's 100x-looser checking run the controller output and the
    # pump-speed signals it drives misalign against the reference (funnel
    # errors 122 and 165 -- not noise, pointwise comparison of a relay
    # signal is the wrong check). Bit-identical at --rtol-factor 1. Those
    # three are checked by accumulated |difference| over the run instead,
    # at a MEASURED integral tolerance: the 100x run switches once more (or
    # less) in 2000 s -- controller 5 vs 6 switches, pump speed 48 vs 47 --
    # for an integral |difference| of 7.0e-3 to 8.0e-3 of the integral of
    # the reference. 0.02 is ~2.5x that.
    enabled: true
    model: Modelica_Requirements.Examples.SimplePumpingSystem.Components.PumpingSystem
    start_time: 0.0
    final_time: 2000.0
    ncp: 5000
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "*.y"]
    integral_abs_variables: [controller.y, PumpRPMGenerator.y, PT1.y]
    integral_tolerance: 0.02
